<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#5b5bd6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b14" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Build, validate and step through Mealy finite-state machines in the browser. Interactive diagram, execution trace and formal definition checks."
    />
    <title>Mealy Machine Studio — visual FSM simulator</title>
    <script>
      // Applied before first paint so the theme never flashes.
      (() => {
        try {
          const stored = localStorage.getItem('mealy-simulator:theme')
          const dark = stored
            ? stored === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
